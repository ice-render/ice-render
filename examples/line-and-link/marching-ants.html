<!DOCTYPE html>

<html lang="en">
  <meta charset="utf-8" />
  <title>ICERender-marching-ants</title>
  <body>
    <div style="font: 13px/1.8 sans-serif; color: #333; padding: 8px;">
      蚂蚁线（marching ants）：<code>lineDash + lineDashFlow</code>，虚线沿路径流动。
      上：选区框（纯蚂蚁线）。下：「管子里流水」（<code>lineBorder</code> 细管壁 + 蚂蚁线）。
    </div>
    <canvas id="canvas-1" width="900" height="400" style="background-color: #fafafa;"></canvas>
  </body>
  <script src="../../dist/index.umd.js"></script>
  <script type="text/javascript">
    let ice = new ICE.ICE().init('canvas-1');

    // 上：蚂蚁线选区框（纯流动虚线）
    new ICE.ICERect({
      left: 100, top: 50, width: 700, height: 100,
      fill: false,
      lineDash: [4, 6],
      lineDashFlow: true,
      lineDashFlowSpeed: 60,
      style: { strokeStyle: '#3B82F6', lineWidth: 2 },
    }).render && undefined; // noop
    ice.addChild(new ICE.ICERect({
      left: 100, top: 50, width: 700, height: 100,
      fill: false,
      lineDash: [4, 6],
      lineDashFlow: true,
      lineDashFlowSpeed: 60,
      style: { strokeStyle: '#3B82F6', lineWidth: 2 },
    }));

    // 下：管子里流水（细管壁 + 蚂蚁线）
    // lineBorderWidth=1 细管壁 + dash 短让水断续可见
    const tube = new ICE.ICEPolyLine({
      points: [[200, 230], [720, 230]],
      lineDash: [4, 8],
      lineDashFlow: true,
      lineDashFlowSpeed: 60,
      lineBorder: true,
      lineBorderWidth: 1,
      lineBorderColor: '#444444',
      style: { strokeStyle: '#059669', lineWidth: 3 },
    });
    ice.addChild(tube);
  </script>
</html>
