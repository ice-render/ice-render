<!DOCTYPE html>

<html lang="en">
  <meta charset="utf-8" />
  <title>ICERender-theme</title>
  <body>
    <div style="font: 13px/1.8 sans-serif; color: #333; padding: 8px;">
      主题机制：<code>palette</code> 数据系列配色 + <code>preset</code> 组件预设 + <code>setTheme('dark')</code> 热切换。
      <button id="dark" style="margin-left: 8px;">暗色</button>
      <button id="light">亮色</button>
      <button id="brand">品牌色</button>
    </div>
    <canvas id="canvas-1" width="900" height="420" style="background-color: #fafafa;"></canvas>
  </body>
  <script src="../../dist/index.umd.js"></script>
  <script type="text/javascript">
    let ice = new ICE.ICE().init('canvas-1');
    window.__ice = ice;

    // ① palette：数据系列配色（从语义主题取色）
    const palette = ice.getTheme().semantic.palette;
    palette.forEach((color, i) => {
      const bar = new ICE.ICERect({ left: 40 + i * 100, top: 50, width: 72, height: 60 + i * 18, radius: 4, style: { fillStyle: color, strokeStyle: color, lineWidth: 1 } });
      ice.addChild(bar);
    });

    // 主题切换时刷新 canvas 背景（preset 组件由 ICE 热切换自动处理）
    function refreshCanvasBg() {
      document.querySelector('canvas').style.background = ice.getTheme().semantic.background;
    }

    // ② preset：卡片 + 标题（引用主题变量）
    const card = new ICE.ICEGroup({ left: 40, top: 250, width: 320, height: 130, fill: false, stroke: false });
    card.addChild(new ICE.ICERect({ preset: 'card', left: 0, top: 0, width: 320, height: 130 }));
    card.addChild(new ICE.ICEText({ left: 0, top: 20, width: 320, height: 40, text: '主题卡片', preset: 'title', style: { textAlign: 'center', textBaseline: 'middle' } }));
    card.addChild(new ICE.ICEText({ left: 0, top: 60, width: 320, height: 24, text: '切换主题会自动跟着变', preset: 'subtitle', style: { textAlign: 'center', textBaseline: 'middle' } }));
    ice.addChild(card);

    // ③ 按钮（preset button）
    const btn = new ICE.ICEGroup({ left: 420, top: 280, width: 160, height: 44, fill: false, stroke: false });
    btn.addChild(new ICE.ICERect({ preset: 'button', left: 0, top: 0, width: 160, height: 44 }));
    btn.addChild(new ICE.ICEText({ left: 0, top: 0, width: 160, height: 44, text: '主按钮', stroke: false, style: { fontSize: 16, fillStyle: '#ffffff', textAlign: 'center', textBaseline: 'middle' } }));
    ice.addChild(btn);

    document.querySelector('#dark').addEventListener('click', () => {
      console.log('DARK CLICK');
      ice.setTheme('dark');
      console.log('AFTER setTheme dark, theme.bg=', ice.getTheme().semantic.background);
      refreshCanvasBg();
    });
    document.querySelector('#light').addEventListener('click', () => {
      ice.setTheme('default');
      refreshCanvasBg();
    });
    document.querySelector('#brand').addEventListener('click', () => {
      ice.registerTheme('brand', { base: ICE.baseTokens, semantic: { ...ice.getTheme().semantic, primary: '#ff6600', background: '#fff7f0', border: '#ffd8b8' } });
      ice.setTheme('brand');
      refreshCanvasBg();
    });
  </script>
</html>
