<!DOCTYPE html>

<html lang="en">
  <meta charset="utf-8" />
  <title>ICERender-flow-layout</title>
  <body>
    <div style="font: 13px/1.8 sans-serif; color: #333; padding: 8px;">
      流式布局 <code>ICEFlowLayout</code>（对齐 Swing FlowLayout）：从左到右排列，超出容器宽度自动换行。
    </div>
    <canvas id="canvas-1" width="800" height="400" style="background-color: #f7f7f7;"></canvas>
  </body>
  <script src="../../dist/index.umd.js"></script>
  <script type="text/javascript">
    let ice = new ICE.ICE().init('canvas-1');

    // 容器（带边框显示布局范围）
    const group = new ICE.ICEGroup({
      left: 60, top: 60, width: 500, height: 260,
      style: { strokeStyle: '#888880', fillStyle: 'transparent', lineWidth: 1 },
    });
    ice.addChild(group);

    // 6 个宽度递增的子矩形，超出容器宽度会换行
    for (let i = 0; i < 6; i++) {
      group.addChild(
        new ICE.ICERect({
          width: 60 + i * 20,
          height: 40,
          style: { strokeStyle: '#0c09d4', fillStyle: '#f5d106', lineWidth: 2 },
        })
      );
    }

    // 设置布局策略（对齐 Swing setLayout）
    group.setLayout(new ICE.ICEFlowLayout({ gap: 10, align: 'left' }));
  </script>
</html>
