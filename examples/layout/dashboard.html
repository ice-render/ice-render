<!DOCTYPE html>

<html lang="en">
  <meta charset="utf-8" />
  <title>ICERender-dashboard</title>
  <body>
    <div style="font: 13px/1.8 sans-serif; color: #333; padding: 8px;">
      KPI 仪表盘（用 <code>preset</code> + <code>shadow</code> 简写 + <code>textAlign: center</code>）——对比之前手写一大坨 style 的版本。
    </div>
    <canvas id="canvas-1" width="900" height="540" style="background-color: #f0f2f5;"></canvas>
  </body>
  <script src="../../dist/index.umd.js"></script>
  <script type="text/javascript">
    let ice = new ICE.ICE().init('canvas-1');

    // 标题栏：preset 'button' 给蓝色底，文字 textAlign center + textBaseline middle 居中
    const title = new ICE.ICEGroup({ left: 40, top: 40, width: 820, height: 56 });
    title.addChild(new ICE.ICERect({ preset: 'button', left: 0, top: 0, width: 820, height: 56 }));
    title.addChild(
      new ICE.ICEText({ left: 0, top: 0, width: 820, height: 56, text: '📊 KPI Dashboard · 2026 Q3', stroke: false, style: { fontSize: 22, fillStyle: '#ffffff', textAlign: 'center', textBaseline: 'middle' } })
    );
    ice.addChild(title);

    // KPI 卡片：preset 'card'（白底 + 圆角 + 阴影），数值/标签用 textAlign center 居中
    const cardW = 392, cardH = 184;
    const kpiData = [
      { value: '12,345', label: '用户总数', color: '#185fa5' },
      { value: '678', label: '今日订单', color: '#37dd0d' },
      { value: '¥1.2M', label: '本月收入', color: '#ef9f27' },
      { value: '3.4%', label: '转化率', color: '#d40c0c' },
    ];
    const positions = [
      { left: 40, top: 116 },
      { left: 40 + cardW + 18, top: 116 },
      { left: 40, top: 116 + cardH + 16 },
      { left: 40 + cardW + 18, top: 116 + cardH + 16 },
    ];

    kpiData.forEach((k, i) => {
      const card = new ICE.ICEGroup({ left: positions[i].left, top: positions[i].top, width: cardW, height: cardH });
      // 卡片：preset 'card'（白底 + 圆角 + 阴影 md）
      card.addChild(new ICE.ICERect({ preset: 'card', left: 0, top: 0, width: cardW, height: cardH }));
      // 顶部彩色装饰条
      card.addChild(new ICE.ICERect({ left: 0, top: 0, width: 56, height: 5, radius: 3, style: { fillStyle: k.color, strokeStyle: k.color, lineWidth: 1 } }));
      // 数值：居中
      card.addChild(new ICE.ICEText({ left: 0, top: 30, width: cardW, height: 60, text: k.value, stroke: false, style: { fontSize: 44, fillStyle: k.color, fontWeight: 'bold', textAlign: 'center', textBaseline: 'middle' } }));
      // 标签：居中
      card.addChild(new ICE.ICEText({ left: 0, top: 105, width: cardW, height: 24, text: k.label, stroke: false, style: { fontSize: 16, fillStyle: '#666666', textAlign: 'center', textBaseline: 'middle' } }));
      // 趋势
      card.addChild(new ICE.ICEText({ left: 0, top: 138, width: cardW, height: 20, text: '↑ 较昨日 +12.5%', stroke: false, style: { fontSize: 13, fillStyle: '#37dd0d', textAlign: 'center', textBaseline: 'middle' } }));
      ice.addChild(card);
    });
  </script>
</html>
