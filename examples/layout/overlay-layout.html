<!DOCTYPE html>

<html lang="en">
  <meta charset="utf-8" />
  <title>ICERender-overlay-layout</title>
  <body>
    <div style="font: 13px/1.8 sans-serif; color: #333; padding: 8px;">
      叠加布局 <code>ICEOverlayLayout</code>（对齐 Swing OverlayLayout）：所有子组件叠放在同一位置，做图层。
    </div>
    <canvas id="canvas-1" width="500" height="300" style="background-color: #f7f7f7;"></canvas>
  </body>
  <script src="../../dist/index.umd.js"></script>
  <script type="text/javascript">
    let ice = new ICE.ICE().init('canvas-1');

    const group = new ICE.ICEGroup({ left: 100, top: 80, width: 200, height: 200, fill: false, style: { strokeStyle: '#6B7280', lineWidth: 1 } });
    ice.addChild(group);

    // 三个图层叠放（大→中→小，颜色不同）
    group.addChild(new ICE.ICERect({ width: 200, height: 200, style: { strokeStyle: '#3B82F6', fillStyle: '#F59E0B', lineWidth: 2 } }));
    group.addChild(new ICE.ICERect({ width: 140, height: 140, style: { strokeStyle: '#059669', fillStyle: '#10B981', lineWidth: 2 } }));
    group.addChild(new ICE.ICERect({ width: 80, height: 80, style: { strokeStyle: '#EF4444', fillStyle: '#F472B6', lineWidth: 2 } }));

    group.setLayout(new ICE.ICEOverlayLayout({}));
  </script>
</html>
