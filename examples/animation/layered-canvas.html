<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>分层渲染：静态层 + 动画层</title>
  <style>
    html, body { margin: 0; padding: 0; font-family: system-ui, sans-serif; background: #f8fafc; }
    #toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; background: #fff; border-bottom: 1px solid #e2e8f0; }
    #toolbar button { padding: 4px 10px; border: 1px solid #cbd5e1; background: #fff; border-radius: 4px; cursor: pointer; }
    #hint { padding: 6px 10px; color: #475569; font-size: 13px; }
    #stage { position: relative; width: 1024px; height: 640px; }
    #stage canvas { position: absolute; left: 0; top: 0; }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="btn-zoom-in">整场景放大（同步两层）</button>
    <button id="btn-zoom-out">整场景缩小</button>
    <button id="btn-reset">复位视口</button>
    <button id="btn-toggle-passthrough">切换动画层输入穿透</button>
    <button id="btn-toggle-anim">暂停/继续动画</button>
    <button id="btn-migrate">把选中的静态图元提升到动画层</button>
    <button id="btn-migrate-back">把动画层里的标记放回静态层</button>
  </div>
  <div id="hint">
    两张 canvas 叠放：<b>下层静态层</b>（只画一次：大量文本/折线/方块）+ <b>上层动画层</b>（每帧只重绘几十个标记）。
    动画层默认 <code>pointer-events: none</code>（输入穿透），所以点击/拖拽仍然作用在下层的图元上；点「切换动画层输入穿透」可以观察差异。
    另外两个按钮演示 <code>moveComponentTo()</code>：把选中的静态图元提升到动画层（拖拽期间只重绘小层），再放回静态层，位置不变。
  </div>
  <div id="stage">
    <canvas id="canvas-static" width="1024" height="640"></canvas>
    <canvas id="canvas-anim" width="1024" height="640"></canvas>
  </div>
  <script src="../../dist/index.umd.js"></script>
  <script>
    // ---- 静态层：画一次就完事（文本 / 折线 / 方块，故意用"贵"的内容）----
    const staticIce = new ICE.ICE().init('canvas-static');
    for (let i = 0; i < 60; i++) {
      staticIce.addChild(
        new ICE.ICEText({
          left: 20 + (i % 6) * 165,
          top: 24 + Math.floor(i / 6) * 60,
          text: '静态标签 ' + i,
          style: { fontSize: 13, fillStyle: '#475569' },
          interactive: true,
          draggable: true,
          // 文本默认 transformable: false；这里显式打开，便于演示"点下层能选中"
          transformable: true,
        })
      );
    }
    for (let i = 0; i < 24; i++) {
      const x = 30 + (i % 8) * 120;
      const y = 470 + Math.floor(i / 8) * 40;
      staticIce.addChild(
        new ICE.ICEPolyLine({
          points: [
            [x, y],
            [x + 40, y + 16],
            [x + 80, y + 4],
          ],
          stroke: true,
          fill: false,
          style: { strokeStyle: '#94a3b8', lineWidth: 1.5 },
        })
      );
    }
    for (let i = 0; i < 400; i++) {
      staticIce.addChild(
        new ICE.ICERect({
          left: (i % 40) * 25,
          top: 300 + Math.floor(i / 40) * 8,
          width: 18,
          height: 5,
          style: { fillStyle: '#e2e8f0' },
        })
      );
    }
    staticIce.dirty = true;
    staticIce.renderer.frameEvtHandler(); // 静态层只画这一帧

    // ---- 动画层：只放会动的东西 ----
    const animIce = new ICE.ICE().init('canvas-anim');
    const COLORS = ['#3B82F6', '#10B981', '#F59E0B', '#EF4444'];
    const markers = [];
    for (let i = 0; i < 40; i++) {
      const left = 40 + (i % 10) * 95;
      const top = 120 + Math.floor(i / 10) * 70;
      const marker = new ICE.ICECircle({
        left,
        top,
        radius: 9,
        style: { fillStyle: COLORS[i % COLORS.length] },
        animations: {
          'transform.translate': { from: [0, 0], to: [40, 22], duration: 1200, easing: 'linear', loop: true },
        },
      });
      markers.push(marker);
      animIce.addChild(marker);
    }
    animIce.dirty = true;
    animIce.renderer.frameEvtHandler();

    // ---- 分层原语：视口双向绑定 + 上层输入穿透 ----
    ICE.ICE.linkViewport(staticIce, animIce);
    animIce.setInputPassthrough(true);

    // ---- 交互：滚轮缩放 / 拖拽平移（任一层操作都会同步另一层）----
    function bindViewportInteraction(el) {
      el.addEventListener('wheel', (evt) => {
        evt.preventDefault();
        const rect = el.getBoundingClientRect();
        staticIce.zoomAt(evt.clientX - rect.left, evt.clientY - rect.top, evt.deltaY < 0 ? 1.1 : 1 / 1.1);
      }, { passive: false });
    }
    bindViewportInteraction(document.getElementById('canvas-static'));
    bindViewportInteraction(document.getElementById('canvas-anim'));

    document.getElementById('btn-zoom-in').onclick = () => staticIce.zoomAt(512, 320, 1.25);
    document.getElementById('btn-zoom-out').onclick = () => staticIce.zoomAt(512, 320, 0.8);
    document.getElementById('btn-reset').onclick = () => staticIce.setViewport(1, 0, 0);
    document.getElementById('btn-toggle-passthrough').onclick = () => {
      animIce.setInputPassthrough(!animIce.isInputPassthrough());
    };
    document.getElementById('btn-toggle-anim').onclick = () => {
      if (animIce.animationManager.isPaused()) {
        animIce.animationManager.resume();
      } else {
        animIce.animationManager.pause();
      }
    };

    // ---- 跨层迁移：拖拽期间把选中的静态图元"提升"到动画层，松手后放回（Konva drag-layer 模式）----
    // 引擎原语 `moveComponentTo` 保证世界坐标不变、事件监听不丢、动画注册与选中态跟着走。
    const promoted = [];
    document.getElementById('btn-migrate').onclick = () => {
      const selected = staticIce.selectionList.filter((c) => promoted.indexOf(c) === -1);
      selected.forEach((component) => {
        const x = component.state.left;
        const y = component.state.top;
        if (staticIce.moveComponentTo(component, animIce)) {
          // 迁移后仍在动画层里可交互：给它挂一个"被拖过"的循环动画，演示"提升后确实由动画层驱动"
          component.props.animations = {
            'transform.translate': { from: [0, 0], to: [12, 0], duration: 900, easing: 'linear', loop: true },
          };
          animIce.animationManager.add(component);
          promoted.push({ component, x, y });
        }
      });
    };
    document.getElementById('btn-migrate-back').onclick = () => {
      while (promoted.length) {
        const item = promoted.pop();
        item.component.props.animations = {};
        animIce.animationManager.remove(item.component);
        if (animIce.moveComponentTo(item.component, staticIce)) {
          // 放回静态层：位置由原语保持，这里顺带复位到迁移前的落点（示例演示用）
          item.component.setState({ left: item.x, top: item.y });
        }
      }
      staticIce.dirty = true;
      staticIce.renderer.frameEvtHandler();
    };

    // 自检用：e2e 通过这两个句柄观察分层是否生效
    window.__staticIce = staticIce;
    window.__animIce = animIce;
  </script>
</body>
</html>
