<!DOCTYPE html>

<html lang="zh-CN">
  <meta charset="utf-8" />
  <title>ice-render 真实画布渲染基准</title>
  <body style="font: 13px/1.7 sans-serif; margin: 0; padding: 12px; background:#fafafa;">
    <h2 style="margin: 0 0 6px;">ice-render 真实画布渲染基准 <code>bench-scene</code></h2>
    <p style="color:#555; margin: 0 0 10px; max-width: 1200px;">
      确定性组件树（无随机），在真实 canvas + Path2D 上做渲染。配合 Playwright
      <code>e2e/visual/perf.spec.ts</code> 自动采集。查询参数：
      <code>n</code>=组件数（默认 5000）、<code>mode</code>=static|anim|fps（默认 anim）、
      <code>frames</code>=同步采样帧数（默认 90）、<code>duration</code>=fps 模式时长 ms（默认 1500）。
      结果会写入 <code>window.__benchResult</code> 并展示在下方。
    </p>
    <canvas id="canvas-1" width="1600" height="1000" style="background-color: #ffffff; border:1px solid #ddd;"></canvas>
    <pre id="out" style="font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; background:#1e1f24; color:#d7e0ea; padding:12px; border-radius:8px; max-height:520px; overflow:auto;"></pre>
  </body>
  <script src="../../dist/index.umd.js"></script>
  <script type="text/javascript">
    (function () {
      // ---- 参数 ----
      const params = new URLSearchParams(location.search);
      const N = Math.max(100, Math.min(parseInt(params.get('n') || '5000', 10) || 5000, 200000));
      const MODE = ['static', 'anim', 'fps'].includes(params.get('mode')) ? params.get('mode') : 'anim';
      const FRAMES = Math.max(10, parseInt(params.get('frames') || '90', 10) || 90);
      const DURATION_MS = Math.max(200, parseInt(params.get('duration') || '1500', 10) || 1500);

      // ---- 构建确定性组件树（与 bench/render.cjs 同构）----
      let ice = null;
      let flat = []; // 展平后的所有组件，anim 模式每帧标脏用
      let totalCount = 0;
      const PALETTE = ['#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#14B8A6', '#EC4899', '#6366F1'];

      function buildTree(targetN) {
        const root = new ICE.ICEGroup({
          width: 2000,
          height: 1000,
          style: { fillStyle: 'transparent', strokeStyle: '#E5E7EB', lineWidth: 1 },
        });
        let count = 1;
        const topGroups = 10;
        const subPerTop = 5;
        const leavesPerSub = Math.max(1, Math.floor((targetN - count) / (topGroups * subPerTop)));
        for (let t = 0; t < topGroups && count < targetN; t++) {
          const g = new ICE.ICEGroup({
            left: t * 40,
            top: 0,
            width: 200,
            height: 200,
            style: { fillStyle: 'transparent', strokeStyle: '#D1D5DB', lineWidth: 1 },
          });
          count++;
          for (let s = 0; s < subPerTop && count < targetN; s++) {
            const sg = new ICE.ICEGroup({
              left: 0,
              top: s * 20,
              width: 80,
              height: 80,
              style: { fillStyle: 'transparent', strokeStyle: '#D1D5DB', lineWidth: 1 },
            });
            count++;
            for (let l = 0; l < leavesPerSub && count < targetN; l++) {
              const color = PALETTE[(l + s + t) % PALETTE.length];
              const left = (l * 7) % 60;
              const top = (l * 11) % 60;
              const leaf =
                l % 3 === 0
                  ? new ICE.ICECircle({ left, top, width: 10, height: 10, style: { fillStyle: color, strokeStyle: 'transparent' } })
                  : l % 3 === 1
                  ? new ICE.ICEStar({ left, top, width: 12, height: 12, style: { fillStyle: color, strokeStyle: 'transparent' } })
                  : new ICE.ICERect({ left, top, width: 14, height: 14, style: { fillStyle: color, strokeStyle: 'transparent' } });
              sg.addChild(leaf);
              count++;
            }
            g.addChild(sg);
          }
          root.addChild(g);
        }
        return root;
      }

      function collect(node) {
        flat.push(node);
        totalCount++;
        if (node.childNodes) node.childNodes.forEach(collect);
      }

      function markAllDirty() {
        for (let i = 0; i < flat.length; i++) flat[i].dirty = true;
      }

      function pct(sorted, p) {
        const idx = Math.min(sorted.length - 1, Math.floor((p / 100) * sorted.length));
        return sorted[idx];
      }
      function stats(samples) {
        const s = samples.slice().sort((a, b) => a - b);
        const sum = s.reduce((x, y) => x + y, 0);
        return {
          avg: sum / s.length,
          p50: pct(s, 50),
          p95: pct(s, 95),
          p99: pct(s, 99),
          max: s[s.length - 1],
          samples: s.length,
        };
      }

      function fmt(x) {
        return Number(x).toFixed(3) + 'ms';
      }

      // ---- 主流程 ----
      const tBuild0 = performance.now();
      ice = new ICE.ICE().init('canvas-1');
      const rootGroup = buildTree(N);
      ice.addChild(rootGroup);
      collect(rootGroup);
      const buildMs = performance.now() - tBuild0;

      // 同步暖一帧，让渲染队列 / 矩阵缓存就位
      ice.dirty = true;
      ice.renderer.frameEvtHandler();

      // 供外部（Playwright spec / 调试探针）访问
      window.__ice = ice;

      // static/anim：同步测「引擎 JS + 真实光栅化」的单帧成本
      function measureSync(mode, iters) {
        const r = ice.renderer;
        for (let i = 0; i < 12; i++) {
          if (mode === 'anim') markAllDirty();
          ice.dirty = true;
          r.frameEvtHandler();
        }
        const samples = [];
        for (let i = 0; i < iters; i++) {
          if (mode === 'anim') markAllDirty();
          ice.dirty = true;
          const t0 = performance.now();
          r.frameEvtHandler();
          const t1 = performance.now();
          samples.push(t1 - t0);
        }
        return stats(samples);
      }

      // fps：在真实 vsync(rAF) 节奏下，每个 rAF 同步完成一帧完整渲染
      // （引擎 JS + 真实光栅化），统计窗口期内「真正完成」的帧数 → 实际帧率。
      // 每个 rAF 只做一帧，帧成本 = 引擎渲染耗时；rAF 下一个回调受帧间隔 + 渲染耗时控制，
      // 因此 fps = frames / elapsed 即反映含光栅化与 vsync 的实际吞吐。
      function measureFps(durationMs) {
        return new Promise((resolve) => {
          let frames = 0;
          const t0 = performance.now();
          (function loop() {
            markAllDirty();
            ice.dirty = true;
            ice.renderer.frameEvtHandler(); // 同步完成一整帧（含真实光栅化）
            frames++;
            const elapsed = performance.now() - t0;
            if (elapsed >= durationMs) {
              resolve({ elapsedMs: elapsed, frames, fps: (frames * 1000) / elapsed });
              return;
            }
            requestAnimationFrame(loop);
          })();
        });
      }

      (async function run() {
        let result = { n: N, mode: MODE, totalComponents: totalCount, canvas: [ice.canvasWidth, ice.canvasHeight], buildMs };
        const lines = [];
        const head = `n=${N}  components=${totalCount}  mode=${MODE}  canvas=${ice.canvasWidth}x${ice.canvasHeight}`;
        lines.push(head);
        lines.push('build(init+addChild): ' + fmt(buildMs));
        lines.push('-'.repeat(64));

        if (MODE === 'fps') {
          const fpsRes = await measureFps(DURATION_MS);
          result = Object.assign(result, {
            elapsedMs: fpsRes.elapsedMs,
            frames: fpsRes.frames,
            fps: fpsRes.fps,
          });
          lines.push(`rAF 节奏下完成渲染 ${fpsRes.frames} 帧 / ${fpsRes.elapsedMs.toFixed(0)}ms`);
          lines.push(`实际帧率: ${fpsRes.fps.toFixed(1)} fps (每 rAF 一帧, 含 vsync 节奏与光栅化)`);
          // 同时补一版「同步单帧成本」作对照
          const sync = measureSync('anim', 30);
          result.syncFrameAnim = sync;
          lines.push(`同步动画帧中位: ${fmt(sync.p50)}  (对照, 不含 vsync)`);
        } else {
          const st = measureSync(MODE, FRAMES);
          const fpsEquiv = 1000 / st.p50;
          result.frameStats = st;
          result.fpsEquivalent = fpsEquiv;
          const label = MODE === 'static' ? '静态重绘(稳态)' : '动画(每帧全量)';
          lines.push(`单帧成本(${label}): avg=${fmt(st.avg)}  p50=${fmt(st.p50)}  p95=${fmt(st.p95)}  p99=${fmt(st.p99)}  max=${fmt(st.max)}`);
          lines.push(`等效帧率: ${fpsEquiv.toFixed(0)} fps (基于 p50)`);
        }
        lines.push('-'.repeat(64));
        lines.push('结果已写入 window.__benchResult');

        document.getElementById('out').textContent = lines.join('\n');
        window.__benchResult = result;
        console.log('[bench-scene]', JSON.stringify(result, null, 2));
      })();
    })();
  </script>
</html>
