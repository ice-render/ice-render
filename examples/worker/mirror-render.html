<!DOCTYPE html>

<html lang="zh-CN">
  <meta charset="utf-8" />
  <title>Worker 镜像渲染 + 主线程交互（状态/命令协议）</title>
  <body style="font: 13px/1.6 sans-serif; padding: 12px">
    <h2 style="margin: 0 0 6px">Worker 镜像渲染 · 输入留在主线程</h2>
    <p style="max-width: 980px; color: #444">
      主线程持有组件树与状态、处理 DOM 事件与命中检测，但**不产出像素** —— 渲染管线照跑（命中检测
      读的是渲染期的世界盒快照），落墨走一个"几何通道"桩。真正的光栅化在 worker 里。
      选择状态会推给 worker，让**worker 侧自己的控制面板**画出手柄（工具层不序列化）。
      <br />
      可见画布刻意**偏离页面左上角**（下面两个画布都有 margin）：输入矩形按可见画布算，
      事件在页面上任何位置都不该错位。
    </p>
    <div style="display: flex; gap: 12px; align-items: flex-start">
      <div style="margin-left: 100px; margin-top: 40px">
        <div style="font-weight: 700">可见画布（显示 worker 位图 · 输入来源）</div>
        <!-- 显示层 + 输入/量测叠层：直绘模式（?direct=1）下显示层没有 2d 上下文、整块交给 worker，
             引擎的输入与文本量测落在这块透明叠层上（两块同尺寸同位置）。位图模式只用到 #view。 -->
        <div style="position: relative; width: 640px; height: 400px">
          <canvas id="view" lang="zh-CN" width="640" height="400" style="background: #fff; border: 1px solid #ccc; display: block"></canvas>
          <canvas id="input" lang="zh-CN" width="640" height="400" style="position: absolute; left: 0; top: 0; border: 1px solid transparent; display: none"></canvas>
        </div>
        <canvas id="probe" lang="zh-CN" width="640" height="400" style="display: none"></canvas>
      </div>
      <div style="margin-top: 40px">
        <div style="font-weight: 700">参考：同一份文档的主线程直绘（仅供比对）</div>
        <canvas id="ref" lang="zh-CN" width="640" height="400" style="background: #fff; border: 1px solid #ccc"></canvas>
      </div>
    </div>
    <pre id="out" style="margin-top: 10px; background: #f6f8fa; padding: 8px; min-height: 80px"></pre>
  </body>
  <script src="../../dist/index.umd.js"></script>
  <script type="text/javascript">
    (function () {
      const ICE = window.ICE;
      const log = [];
      const out = document.getElementById('out');
      const view = document.getElementById('view');
      const inputLayer = document.getElementById('input');
      const probe = document.getElementById('probe');
      const W = 640;
      const H = 400;
      /**
       * 直绘模式（`?direct=1`）：显示层必须**还没有 2d 上下文**才能 `transferControlToOffscreen()`
       * —— 所以引擎 init 在透明的输入/量测叠层上（输入、命中、文本量测都在它上面），
       * 显示层整块交给 worker 直接画。位图模式一切照旧：引擎 init 在可见画布上。
       */
      const params = new URLSearchParams(location.search);
      const direct = params.get('direct') === '1';
      if (direct) {
        inputLayer.style.display = 'block';
      }

      // ---- 主线程：唯一真相（组件树 + 状态 + 事件 + 命中）----
      const ice = new ICE.ICE();
      ice.init(direct ? 'input' : 'view', { renderMode: 'full' });

      function buildScene(target) {
        const bg = new ICE.ICERect({
          left: 0, top: 0, width: W, height: H, fill: true, stroke: false, interactive: false,
          style: { fillStyle: '#ffffff' },
        });
        target.addChild(bg);
        const group = new ICE.ICEGroup({
          left: 40, top: 40, width: 260, height: 150, interactive: false,
          style: { fillStyle: '#EFF6FF', strokeStyle: '#3B82F6', lineWidth: 2 },
        });
        target.addChild(group);
        const rect = new ICE.ICERect({
          left: 20, top: 20, width: 120, height: 60, radius: 10,
          interactive: true, draggable: true, transformable: true,
          style: { fillStyle: '#2563EB', strokeStyle: '#0F172A', lineWidth: 2 },
        });
        group.addChild(rect);
        const circle = new ICE.ICECircle({
          left: 190, top: 60, radius: 30,
          interactive: true, draggable: true, transformable: true,
          style: { fillStyle: '#16A34A' },
        });
        target.addChild(circle);
        return { bg, group, rect, circle };
      }

      const nodes = buildScene(ice);

      // ---- 参考渲染：同一份文档 + 同一份选择，用主线程真实上下文画一遍（只为比对）----
      const reference = new ICE.ICE();
      reference.init('ref', { renderMode: 'full' });
      reference.fromJSONObject(ice.toJSONObject());
      /**
       * 主线程现在把面板**显示**给了谁（= 镜像要复现的那份状态）。
       *
       * 判定必须看面板的 `display`，不能只看 `targetComponent`：点空白处时引擎只是
       * `disable()`（display:false），targetComponent 还留着旧值。
       */
      const panelTargetOf = (target) => {
        const m = target.controlPanelManager;
        if (!m) return null;
        const visible = (panel) => !!(panel && panel.state && panel.state.display && panel.targetComponent);
        if (visible(m.transformControlPanel)) return m.transformControlPanel.targetComponent;
        if (visible(m.lineControlPanel)) return m.lineControlPanel.targetComponent;
        return null;
      };
      const syncReference = () => {
        reference.fromJSONObject(ice.toJSONObject());
        const shown = panelTargetOf(ice);
        const node = shown ? findById(reference.childNodes, shown.props.id) : null;
        if (node) reference.setSelection([node]);
        // 控制面板要显式走这条公开入口（它不在 setSelection 里 —— 主线程是 mousedown 时挂的）
        if (reference.controlPanelManager) {
          reference.controlPanelManager.applySelection(node || null, false);
        }
      };
      function findById(list, id) {
        for (const node of list || []) {
          if (node.props.id === id) return node;
          const hit = findById(node.childNodes, id);
          if (hit) return hit;
        }
        return null;
      }

      // ---- 宿主：几何通道 + 显示 worker 位图 + 节拍 ----
      // `?backend=main` 强制主线程渲染、`?worker=xxx.js` 换一个（可以是坏的）worker 脚本：
      // 两条都是给"兼容回退"的 e2e 用的开关（见 e2e/visual/worker-fallback.spec.ts）
      const forceMain = params.get('backend') === 'main';
      const workerUrl = params.get('worker') || 'mirror-worker.js';
      const support = ICE.MirrorHost.detect({ canvas: view });
      log.push(
        `[兼容探测] ${support.supported ? 'ok' : '不支持'} · worker=${support.caps.worker} offscreen=${support.caps.offscreenCanvas} imageBitmap=${support.caps.imageBitmap} bitmapRenderer=${support.caps.bitmapRenderer}`
      );
      const host = new ICE.MirrorHost({
        canvas: view,
        ice,
        workerUrl,
        // `?direct=1`：把可见画布整块交给 worker（省掉每帧位图回传；主线程读不到像素了）
        transferCanvas: direct,
        // 起不来（探测不过 / worker 404 / 握手超时 / 半路死掉）就自动回退主线程渲染
        fallback: 'auto',
        onFallback: (info) => {
          log.push(`[回退] ${info.reason} —— ${info.message}`);
          out.textContent = log.slice(-8).join('\n');
          window.__fallback = { reason: info.reason, message: info.message, missing: info.support.missing };
        },
        onBitmap: (bitmap, stats) => {
          // 取像素用的旁路：drawImage 不消耗位图，之后 MirrorHost 再把它交给 bitmaprenderer
          const pctx = probe.getContext('2d');
          pctx.clearRect(0, 0, W, H);
          pctx.drawImage(bitmap, 0, 0);
          log.push(
            `[帧 ${stats.frames}] worker ${stats.renderMs.toFixed(2)}ms 组件=${stats.components} ops=${stats.appliedOps} 选择=${stats.appliedSelections || 0}`
          );
          out.textContent = log.slice(-8).join('\n');
        },
        onEvent: (evt) => {
          if (evt.t === 'error' || evt.t === 'missing') {
            log.push(`[evt] ${evt.t}${evt.ids ? ' ' + evt.ids.join(',') : ''}${evt.message ? ' ' + evt.message : ''}`);
            out.textContent = log.slice(-8).join('\n');
          }
        },
      });
      if (forceMain) {
        // 显式走主线程（用于验证"没有 worker 也一切正常"）
        window.__fallback = { reason: 'forced', message: '?backend=main', missing: [] };
        log.push('[回退] forced —— ?backend=main 强制主线程渲染');
      } else {
        host.start();
      }

      // ---- 探针把手（e2e 用）----
      window.__ready = () => host.frames > 0 || !!window.__fallback;
      window.__host = host;
      window.__nodes = nodes;
      window.__selection = () => (ice.selectionList || []).map((c) => c.props.id);
      window.__stats = () => ({
        frames: host.frames,
        sent: host.bridge.sent,
        last: host.stats,
        log: log.slice(-6),
      });
      window.__step = function (i) {
        switch (i) {
          case 0:
            break;
          case 1:
            nodes.rect.setState({ left: 60, top: 30, style: { fillStyle: '#DC2626' } });
            break;
          case 2:
            nodes.circle.setState({ radius: 44 });
            break;
          case 3:
            nodes.group.addChild(
              new ICE.ICERect({
                left: 150, top: 100, width: 70, height: 32, radius: 6, interactive: true, draggable: true,
                style: { fillStyle: '#F59E0B' },
              })
            );
            break;
          case 4:
            nodes.group.removeChild(nodes.group.childNodes[nodes.group.childNodes.length - 1]);
            break;
          default:
            return false;
        }
        // 宿主显式要一帧：空闲门控下"没有变化"不会自动发节拍，而夹具（与真实宿主一样）
        // 需要"这一步之后的画面"是可等待的。
        // 已经回退（或强制 main）时 worker 不在画了 —— 那就**自己重绘一帧**，
        // 这样同一套夹具在两种后端下都能用（也正是"回退后功能不缺"的验收方式）。
        if (host.running) {
          host.paint();
        } else {
          ice.dirty = true;
          ice.renderer.frameEvtHandler();
        }
        return true;
      };

      /** 可见画布 / 像素旁路的墨迹包围盒（回退验收用：画面必须真的有东西）。 */
      window.__inkBox = function (which) {
        const target = which === 'probe' ? probe : view;
        const d = target.getContext('2d').getImageData(0, 0, W, H).data;
        let n = 0, minX = 1e9, minY = 1e9, maxX = -1, maxY = -1;
        for (let i = 0; i < d.length; i += 4) {
          if (d[i + 3] > 8) {
            const x = (i / 4) % W, y = Math.floor((i / 4) / W);
            n++;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
        return { n, box: [minX, minY, maxX, maxY] };
      };
      /** 画面指纹（抽样哈希）：用来断言"回退之后改状态画面真的变了"。 */
      window.__pixelHash = function (which) {
        const target = which === 'probe' ? probe : view;
        const d = target.getContext('2d').getImageData(0, 0, W, H).data;
        let h = 0;
        for (let i = 0; i < d.length; i += 16) {
          h = (h * 31 + d[i] + d[i + 1] * 3 + d[i + 2] * 7 + d[i + 3] * 11) | 0;
        }
        return h;
      };
      /** 镜像是否真的在跑（回退之后必须为 false）。 */
      window.__hostActive = function () {
        return host.running && !host.fallbackReason;
      };
      /** 直绘模式提示：没有位图回传，`__compare()`（比 probe 画布）在这种模式下无意义。 */
      window.__isDirect = function () {
        return direct;
      };
      /** 直绘模式是否生效（e2e 用）。 */
      window.__directCanvas = function () {
        return !!host.directCanvas;
      };

      /** 等 worker 再送一帧（最多 3s）。 */
      window.__waitFrame = function (since) {
        return new Promise((resolve, reject) => {
          const t0 = Date.now();
          const poll = () => {
            if (host.frames > since) return resolve(host.stats);
            if (Date.now() - t0 > 3000) return reject(new Error('等 worker 帧超时'));
            setTimeout(poll, 30);
          };
          poll();
        });
      };

      /** 组件在**页面**坐标里的中心点（用于真实鼠标事件；刻意不假设画布在左上角）。 */
      window.__centerOf = function (key) {
        const node = nodes[key];
        const box = node.getMinBoundingBox(true).getMinAndMaxPoint();
        const rect = view.getBoundingClientRect();
        return { x: rect.left + (box.minX + box.maxX) / 2, y: rect.top + (box.minY + box.maxY) / 2 };
      };

      /**
       * 逐像素比对：worker 位图（经 2d probe）vs 参考渲染。
       *
       * 口径与离屏缓存保真同源：alpha 逐位相同；几何场景（无文本）钉严格 0 差异。
       */
      window.__compare = function () {
        syncReference();
        // 参考渲染同步跑一帧再读像素：`applySelection` 只是标脏，等下一帧才落墨，
        // 用 rAF 等一帧会跟 worker 的节拍赛跑（谁先谁后不确定）
        reference.dirty = true;
        reference.renderer.frameEvtHandler();
        return new Promise((resolve) => {
          requestAnimationFrame(() => {
            const read = (canvas) => canvas.getContext('2d').getImageData(0, 0, W, H).data;
            const a = read(probe);
            const b = read(document.getElementById('ref'));
            let diff = 0;
            let alphaDiff = 0;
            let maxChannel = 0;
            let maxPremult = 0;
            let first = -1;
            const pm = (c, al) => Math.round((c * al) / 255);
            for (let i = 0; i < a.length; i += 4) {
              const aa = a[i + 3];
              const ba = b[i + 3];
              let d = 0;
              for (let k = 0; k < 4; k++) d = Math.max(d, Math.abs(a[i + k] - b[i + k]));
              if (d) {
                diff++;
                if (first < 0) first = i / 4;
              }
              if (aa !== ba) alphaDiff++;
              maxChannel = Math.max(maxChannel, Math.abs(a[i] - b[i]), Math.abs(a[i + 1] - b[i + 1]), Math.abs(a[i + 2] - b[i + 2]));
              maxPremult = Math.max(
                maxPremult,
                Math.abs(pm(a[i], aa) - pm(b[i], ba)),
                Math.abs(pm(a[i + 1], aa) - pm(b[i + 1], ba)),
                Math.abs(pm(a[i + 2], aa) - pm(b[i + 2], ba)),
                Math.abs(aa - ba)
              );
            }
            resolve({ diff, alphaDiff, maxChannel, maxPremult, firstPixel: first, total: W * H });
          });
        });
      };

      /** 控制面板手柄的颜色（主题 chrome.selection.stroke）：用来断言"选择反馈出现在 worker 画面里"。 */
      window.__panelPixels = function () {
        const d = probe.getContext('2d').getImageData(0, 0, W, H).data;
        let n = 0;
        for (let i = 0; i < d.length; i += 4) {
          if (d[i + 3] > 200 && Math.abs(d[i] - 139) < 26 && d[i + 1] < 30 && d[i + 2] < 30) n++;
        }
        return n;
      };
    })();
  </script>
</html>
